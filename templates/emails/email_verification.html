<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Verify your email — Zarly BigFood</title>
</head>
<body style="margin:0;padding:0;background:#f8fafc;font-family:Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;padding:40px 16px;">
    <tr><td align="center">
      <table width="480" cellpadding="0" cellspacing="0"
             style="background:#ffffff;border-radius:12px;border:1px solid #e2e8f0;overflow:hidden;max-width:480px;width:100%;">
        <!-- Header -->
        <tr>
          <td style="background:linear-gradient(135deg,#ff9933,#e07e1e);padding:32px;text-align:center;">
            <div style="font-size:2.5rem;line-height:1;">🍊</div>
            <h1 style="color:#ffffff;margin:8px 0 0;font-size:1.3rem;font-weight:700;letter-spacing:-0.01em;">
              Zarly BigFood
            </h1>
          </td>
        </tr>
        <!-- Body -->
        <tr>
          <td style="padding:36px 40px;">
            <h2 style="color:#1e293b;margin:0 0 8px;font-size:1.15rem;font-weight:700;">
              Hi {{ username }},
            </h2>
            <p style="color:#475569;margin:0 0 28px;line-height:1.65;font-size:0.95rem;">
              Use this code to verify your email address:
            </p>
            <!-- OTP Box -->
            <div style="background:#fff7ed;border:2px solid #ff9933;border-radius:10px;
                        padding:22px 16px;text-align:center;margin-bottom:28px;">
              <span style="font-size:2.4rem;font-weight:800;letter-spacing:0.4em;
                           color:#e07e1e;font-family:'Courier New',monospace;">
                {{ otp }}
              </span>
            </div>
            <p style="color:#94a3b8;font-size:0.82rem;margin:0;text-align:center;line-height:1.5;">
              This code expires in <strong>5 minutes</strong>.<br>
              Do not share it with anyone.
            </p>
          </td>
        </tr>
        <!-- Footer -->
        <tr>
          <td style="background:#f8fafc;padding:18px 40px;text-align:center;
                     border-top:1px solid #e2e8f0;">
            <p style="color:#94a3b8;font-size:0.78rem;margin:0;line-height:1.5;">
              If you did not create a Zarly BigFood account, you can safely ignore this email.
            </p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
