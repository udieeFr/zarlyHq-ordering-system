{% extends 'admin_base.html' %}

{% block page_title %}Edit Product — {{ product.name }}{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Edit Product</h1>
  <p>Update details, price, and stock for <strong>{{ product.name }}</strong>.</p>
</div>

<div class="mb-3">
  <a href="{% url 'inventory_list' %}" class="btn btn-outline-secondary">← Back to Inventory</a>
</div>

<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="content-card">
      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label fw-bold">Product Name</label>
          <input type="text" name="name" value="{{ product.name }}" class="form-control" required>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label fw-bold">Price (RM)</label>
            <div class="input-group">
              <span class="input-group-text">RM</span>
              <input type="number" name="price" value="{{ product.price }}" step="0.01" min="0" class="form-control" required>
            </div>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Stock</label>
            <input type="number" name="stock" value="{{ product.stock }}" min="0" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold">Weight (grams)</label>
            <input type="number" name="weight_grams" value="{{ product.weight_grams }}" min="0" class="form-control">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Category</label>
          <select name="category" class="form-select" required>
            {% for cat in categories %}
            <option value="{{ cat.id }}" {% if cat.id == product.category_id %}selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold">Allergens</label>
          <div class="d-flex flex-wrap gap-2">
            {% for a in allergies %}
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="allergies" value="{{ a.id }}" id="a{{ a.id }}"
                {% if a.id in selected_allergies %}checked{% endif %}>
              <label class="form-check-label" for="a{{ a.id }}">{{ a.name }}</label>
            </div>
            {% endfor %}
          </div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary fw-bold px-4">Save Changes</button>
          <a href="{% url 'inventory_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
