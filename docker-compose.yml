services:
  db:
    image: postgres:17
    container_name: zarlyos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-zarlyos}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-passwordDBzarlyhq1401}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No ports exposed — DB only accessible internally on the VPS.
    # For local dev, see docker-compose.override.yml which exposes 5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zarlyos-network

  redis:
    image: redis:7-alpine
    container_name: zarlyos-redis
    restart: unless-stopped
    # Persist OTP / rate-limit state across restarts (appendonly file).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    # No ports exposed — only reachable internally on the VPS network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zarlyos-network

  django:
    image: udieefr/zarlyhq:latest
    container_name: zarlyos-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DEBUG: ${DEBUG:-False}
      # Shared cache across all gunicorn workers — required for OTP + rate limiting.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
      DATABASE_NAME: ${DB_NAME:-zarlyos}
      DATABASE_USER: ${DB_USER:-postgres}
      DATABASE_PASSWORD: ${DB_PASSWORD:-passwordDBzarlyhq1401}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:-${STRIPE_PUBLISHABLE_KEY}}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      FERNET_KEY: ${FERNET_KEY}
      SUPPORT_CHAT_KEY: ${SUPPORT_CHAT_KEY:-${FERNET_KEY}}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@zarlybigfood.com}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
    volumes:
      - static_files:/app/staticfiles
      - ./media:/app/media
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/start/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - zarlyos-network

  nginx:
    image: nginx:alpine
    container_name: zarlyos-web
    restart: unless-stopped
    depends_on:
      - django
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/app/staticfiles:ro
      - ./media:/app/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - zarlyos-network

networks:
  zarlyos-network:
    driver: bridge

volumes:
  postgres_data:
  static_files:
  redis_data:
